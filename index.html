<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brizall catalogue</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/css/intlTelInput.css">
</head>
<body>

  <img src="assets/logo.png" alt="Brizall" class="logo">

  <main class="wrap">
    <div class="card" id="card">

      <!-- STEP 1: FORM -->
      <section id="formStep" class="step">
        <h1>Get instant access</h1>
        <p class="sub">Tell us where to reach you</p>

        <form id="leadForm" novalidate>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" required>
          <span class="error" id="nameError"></span>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email" required>
          <span class="error" id="emailError"></span>

          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" placeholder="Phone number" autocomplete="tel" required>
          <span class="error" id="phoneError"></span>

          <button type="submit" id="submitBtn">
            <span class="btnLabel">Continue</span>
          </button>
          <p class="formNote" id="formNote"></p>
        </form>
      </section>

      <!-- STEP 2: DOWNLOAD -->
      <section id="downloadStep" class="step hidden">
        <h1>Your download is ready</h1>
        <p class="sub" id="thankYouMsg">Thank you for reaching out! the file is ready when you are.</p>
        <a href="assets/Brizall_Catlogue.pdf" download class="downloadBtn" id="downloadBtn">Download Catalogue</a>
      </section>

    </div>
    <p class="footNote">By submitting, you agree to be contacted about this catalogue.</p>
  </main>

<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js"></script>
<script src="script.js"></script>
</body>
</html>
